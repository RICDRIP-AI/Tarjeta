<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Ricardo Arias Zapata — Cirujano Dentista</title>
<meta name="description" content="Contacta al Dr. Ricardo Arias Zapata: WhatsApp, redes sociales y ubicación del consultorio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --porcelana:#181818;
    --tinta:#CCCCCC;
    --menta:#0E639C;
    --menta-suave:#2D2D2D;
    --cromo:#808080;
    --blanco:#252526;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--porcelana);
    color:var(--tinta);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .tarjeta{
    width:100%;
    max-width:430px;
    padding:28px 22px 40px;
  }
  /* Foto en arco (forma de arcada dental) */
  .foto-marco{
    width:200px;
    height:230px;
    margin:0 auto;
    border-radius:110px 110px 26px 26px;
    overflow:hidden;
    border:4px solid var(--blanco);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
    background:var(--menta-suave);
  }
  .foto-marco img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 30%;
    display:block;
  }
  header{text-align:center;margin-top:22px}
  .nombre{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;
    font-size:1.7rem;
    line-height:1.15;
    letter-spacing:-.01em;
  }
  .titulo{
    margin-top:6px;
    font-size:.92rem;
    font-weight:500;
    color:var(--cromo);
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .divisor{
    width:56px;height:4px;border-radius:2px;
    background:var(--menta);
    margin:18px auto 0;
  }
  /* Redes sociales en círculos */
  .redes{
    display:flex;justify-content:center;gap:16px;
    margin-top:22px;
  }
  .redes a{
    width:52px;height:52px;border-radius:50%;
    background:var(--blanco);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.10);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .redes a:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.16)}
  .redes svg{width:24px;height:24px;fill:var(--tinta)}
  /* Botones de acción */
  .acciones{
    margin-top:26px;
    display:flex;flex-direction:column;gap:12px;
  }
  .btn{
    display:flex;align-items:center;gap:14px;
    padding:15px 18px;
    border-radius:16px;
    text-decoration:none;
    font-weight:600;
    font-size:1rem;
    background:var(--blanco);
    color:var(--tinta);
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.14)}
  .btn .icono{
    width:40px;height:40px;border-radius:12px;
    background:var(--menta-suave);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn .icono svg{width:20px;height:20px;fill:var(--menta)}
  .btn .flecha{margin-left:auto;color:var(--cromo);font-size:1.1rem}
  /* Botón principal (WhatsApp) */
  .btn.principal{
    background:var(--menta);
    color:var(--blanco);
    box-shadow:0 8px 22px rgba(23,168,140,.35);
  }
  .btn.principal .icono{background:rgba(255,255,255,.18)}
  .btn.principal .icono svg{fill:var(--blanco)}
  .btn.principal .flecha{color:rgba(255,255,255,.8)}
  footer{
    margin-top:34px;
    text-align:center;
    font-size:.78rem;
    color:var(--cromo);
  }
  @media (prefers-reduced-motion: reduce){
    .btn,.redes a{transition:none}
  }
</style>
</head>
